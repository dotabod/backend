name: Update dotaconstants consumers

on:
  workflow_dispatch:
    inputs:
      force:
        description: Refresh pins even if only tracking metadata changed
        type: boolean
        default: false
      constants_sha:
        description: Optional full fork commit SHA for a preview PR (otherwise fork master)
        type: string
  schedule:
    - cron: '43 * * * *' # After the fork's hourly source check; GitHub may delay schedules.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dotaconstants-consumers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: dotabod/backend
            manifest: packages/dota/package.json
            filter: '@dotabod/dota'
          - repository: dotabod/frontend
            manifest: package.json
            filter: dotabod-frontend
    steps:
      - name: Check updater credentials
        env:
          UPDATE_TOKEN: ${{ secrets.GHA_PAT }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo '::error::GHA_PAT is required to update both repositories and trigger their CI.'
            exit 1
          fi
      - name: Checkout updater
        uses: actions/checkout@v7
        with:
          path: tooling
      - name: Checkout consumer
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: master
          token: ${{ secrets.GHA_PAT }}
          path: consumer
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Detect generated data changes
        id: scan
        working-directory: consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ matrix.manifest }}
          CONSTANTS_SHA: ${{ inputs.constants_sha }}
          FORCE_UPDATE: ${{ inputs.force && 'true' || 'false' }}
        run: python ../tooling/.github/scripts/update_dotaconstants.py
      - uses: pnpm/action-setup@v6
        if: steps.scan.outputs.should_update == 'true'
        with:
          version: 11.2.2
          package_json_file: consumer/package.json
      - uses: actions/setup-node@v7
        if: steps.scan.outputs.should_update == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: consumer/pnpm-lock.yaml
      - name: Update the exact pin and lockfile
        if: steps.scan.outputs.should_update == 'true'
        working-directory: consumer
        env:
          PACKAGE_FILTER: ${{ matrix.filter }}
          CONSTANTS_SHA: ${{ steps.scan.outputs.latest_sha }}
        run: pnpm --filter "$PACKAGE_FILTER" add "dotaconstants@github:dotabod/dotaconstants#$CONSTANTS_SHA" --lockfile-only --ignore-scripts
      - name: Create update PR
        id: pr
        if: steps.scan.outputs.should_update == 'true'
        uses: peter-evans/create-pull-request@v8.1.2
        with:
          path: consumer
          token: ${{ secrets.GHA_PAT }}
          title: 'chore: update dotaconstants generated data'
          body: |
            Refresh the Dotabod constants fork pin and lockfile together.

            - Previous commit: `${{ steps.scan.outputs.current_sha }}`
            - Target commit: `${{ steps.scan.outputs.latest_sha }}`
            - Generated data changes: `${{ steps.scan.outputs.changed_files }}`

            Scheduled checks cover all generated JSON datasets and package entry points.
            Tracking-only commits do not create update PRs. Preview commits that are not
            yet in the fork's master history remain open for review.
          base: master
          branch: ci/update-dotaconstants
          commit-message: 'chore: refresh dotaconstants pin and lockfile'
          delete-branch: true
          add-paths: |
            ${{ matrix.manifest }}
            pnpm-lock.yaml
      - name: Merge only after the consumer CI and checks pass
        if: steps.pr.outputs.pull-request-number && steps.scan.outputs.allow_automerge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GHA_PAT }}
          GH_REPO: ${{ matrix.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 60); do
            run_id=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$PR_HEAD_SHA&event=pull_request" \
              --jq '.workflow_runs[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo '::error::Consumer CI did not start; leaving the PR open.'
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 15
          gh pr checks "$PR_NUMBER" --watch --interval 15 --fail-fast
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$PR_HEAD_SHA"
