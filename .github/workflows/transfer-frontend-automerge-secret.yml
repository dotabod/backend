name: Transfer Frontend Automerge Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Copy scoped merge token to frontend
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.GHA_PAT }}
        run: |
          printf '%s' "$SOURCE_TOKEN" | gh secret set GHA_PAT \
            --repo dotabod/frontend --env prod
