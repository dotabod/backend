name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # For PRs, group by head ref so a new push cancels the in-flight run. For
  # master pushes, github.ref is the branch ref. Either way one run per ref.
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  # A new master push must not cancel a deployment while it replaces a singleton.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # `injectWorkspacePackages: true` (pnpm-workspace.yaml) hard-copies each workspace
      # dep's `files` into consumers' node_modules at install time — it's a static
      # snapshot, not a symlink, and pnpm never re-syncs it on a later `pnpm install`
      # even with --force (nothing in the lockfile changed). So shared-utils/profanity-filter
      # must be built *before* the full install that populates their consumers, or
      # consumers get an injected copy with no dist/ and fail to resolve at runtime.
      - name: Install shared-utils + profanity-filter (for build)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm install --frozen-lockfile --filter @dotabod/shared-utils --filter @dotabod/profanity-filter
      - name: Build workspace deps for tests
        run: pnpm --filter @dotabod/shared-utils --filter @dotabod/profanity-filter run build
      - name: Install remaining dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm install --frozen-lockfile
      - name: Format, lint, typecheck + dead-code check
        run: pnpm run quality
      - name: Run tests
        run: pnpm exec vitest run
      - name: Test constants update detection
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Test deployment orchestration
        run: python -m unittest discover -s scripts/deploy -p 'test_*.py' -v
      - name: Build all packages
        run: pnpm run build:all

  vision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/clip-processor-py
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install native dependencies for Pillow and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libjpeg-dev zlib1g-dev libopenblas-dev
      - run: uv run --locked --python 3.14 pytest

  build-images:
    needs: [test, vision-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/builder.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy:
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build-images.outputs.services != '[]'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      mode: deploy
      services: ${{ needs.build-images.outputs.services }}
      revision: ${{ github.sha }}
      build_run_id: ${{ github.run_id }}
