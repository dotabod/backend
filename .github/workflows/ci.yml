name: Deploy Dota refund fix

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, deploy]
        default: inspect
        required: true
      revision:
        type: string
        default: 759dec583f91205ab1e09fe5ef46eb62ee368cff
        required: true

permissions:
  contents: read

concurrency:
  group: manual-dota-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Inspect or deploy the production Dota application
        env:
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          COOLIFY_HOST: ${{ secrets.COOLIFY_HOST }}
          DEPLOY_MODE: ${{ inputs.mode }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ops/deploy-refund-fix.py
