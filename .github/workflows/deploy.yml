name: Release to Coolify

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: deploy
      services:
        type: string
        required: true
      revision:
        type: string
        required: true
      build_run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect configuration or deploy a previously successful release
        type: choice
        options: [inspect, deploy]
        default: inspect
      service:
        type: choice
        options: [all, dota, steam, twitch-chat, twitch-events, vision]
        default: all
      ci_run_id:
        description: Successful master CI run containing the desired image manifests (deploy only)
        type: string

permissions:
  contents: read
  actions: read

# Never cancel a running cutover, including when a newer release is queued.
concurrency:
  group: coolify-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.release.outputs.services }}
      revision: ${{ steps.release.outputs.revision }}
      run_id: ${{ steps.release.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Select verified release images
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODE: ${{ inputs.mode }}
          RELEASE_SERVICES: ${{ inputs.services || '[]' }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_RUN_ID: ${{ inputs.build_run_id }}
          SELECTED_SERVICE: ${{ inputs.service || 'all' }}
          MANUAL_RUN_ID: ${{ inputs.ci_run_id }}
        run: python scripts/deploy/coolify.py prepare

  deploy:
    needs: prepare
    if: needs.prepare.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment: prod
    # Up to ten minutes for deployment and five for Docker/Coolify health,
    # plus checkout, artifact download and API overhead.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the image manifest from its build run
        # Vision has no image manifest: Coolify builds it from the release commit.
        if: inputs.mode == 'deploy' && matrix.service != 'vision'
        uses: actions/download-artifact@v8
        with:
          name: coolify-image-${{ matrix.service }}
          path: release
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Inspect or deploy the production application
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_API_KEY: ${{ secrets.COOLIFY_API_KEY }}
          COOLIFY_HOST: ${{ secrets.COOLIFY_HOST }}
          DEPLOY_MODE: ${{ inputs.mode }}
          RELEASE_SERVICE: ${{ matrix.service }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
          AUTOMATIC_RELEASE: ${{ inputs.build_run_id != '' && 'true' || 'false' }}
        run: python scripts/deploy/coolify.py deploy
