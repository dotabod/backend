name: Docker Image CI

on:
  workflow_call:
    outputs:
      services:
        description: Services whose images were published
        value: ${{ jobs.changes.outputs.services }}
  workflow_dispatch:
  push:
    # Master builds are called by CI after quality, tests and package builds pass.
    branches-ignore:
      - master

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Diff the full push range so an earlier commit in a push can trigger a rebuild.
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            shared:
              - 'packages/profanity-filter/**'
              - 'packages/shared-utils/**'
              - 'packages/*/package.json'
              - 'packages/steam/healthcheck.mjs'
              - 'packages/Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'tsconfig.json'
              - 'tsdown.config.ts'
              - '.github/workflows/builder.yml'
            dota:
              - 'packages/dota/**'
            twitch-chat:
              - 'packages/twitch-chat/**'
            steam:
              - 'packages/steam/**'
            twitch-events:
              - 'packages/twitch-events/**'

      - name: Select services to build
        id: select
        env:
          CHANGED_FILTERS: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || jq -e 'index("shared") != null' <<< "$CHANGED_FILTERS" >/dev/null; then
            services=$(docker compose config --format json | jq -c '
              [.services | to_entries[]
                | select(.value.build.dockerfile | . == "./packages/Dockerfile" or . == "packages/Dockerfile")
                | .key]')
          else
            services=$CHANGED_FILTERS
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    # Native arm64 runner (free on public repos) — avoids the ~5-10x QEMU
    # emulation overhead from building linux/arm64 on ubuntu-latest (amd64).
    runs-on: ubuntu-24.04-arm
    environment: prod
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract branch name
        shell: bash
        run: |
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> "$GITHUB_ENV"
          # Sanitize branch name for Docker tag (replace '/' with '-')
          echo "DOCKER_TAG=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')" >> "$GITHUB_ENV"
          # Immutable per-commit tag + OCI label metadata
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:latest
          buildkitd-flags: --debug

      - name: Login to ghcr
        if: github.actor != 'dependabot[bot]' || github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHA_PAT }}

      # cache-to mode=min only exports the final-stage layers (vs mode=max
      # exporting every intermediate step). Saves ~25-30s of cache upload per
      # build; tradeoff is that intermediate stages re-run on cache miss — but
      # those steps total ~10s, so we come out ahead.
      - name: Build and push
        id: image
        uses: docker/bake-action@v7
        with:
          # Unmerged Dependabot branches lack GHA_PAT. Approved master changes
          # can publish after the caller's CI gate regardless of the actor.
          push: ${{ github.actor != 'dependabot[bot]' || github.ref == 'refs/heads/master' }}
          provenance: false
          targets: ${{ matrix.service }}
          set: |
            *.platform=linux/arm64
            *.args.COMMIT_HASH=${{ env.GIT_SHA }}
            ${{ matrix.service }}.tags=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ env.DOCKER_TAG }}
            ${{ matrix.service }}.tags+=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:sha-${{ env.GIT_SHA }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.created=${{ env.BUILD_DATE }}
            *.labels.org.opencontainers.image.version=${{ env.DOCKER_TAG }}
            *.cache-from=type=gha,scope=${{ matrix.service }}
            *.cache-to=type=gha,mode=min,scope=${{ matrix.service }}

      - name: Record the published image
        if: github.actor != 'dependabot[bot]' || github.ref == 'refs/heads/master'
        env:
          BAKE_METADATA: ${{ steps.image.outputs.metadata }}
          RELEASE_SERVICE: ${{ matrix.service }}
        run: python scripts/deploy/coolify.py manifest

      - name: Save release manifest
        if: github.actor != 'dependabot[bot]' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coolify-image-${{ matrix.service }}
          path: release/${{ matrix.service }}.json
          if-no-files-found: error
