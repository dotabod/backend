name: Autofix

# Runs the standalone quality tools' fixes on every PR and pushes them back to
# the PR branch, so formatting never becomes a merge blocker. The push uses
# GHA_PAT (not the default GITHUB_TOKEN) so it re-triggers CI on the fixed code.
on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: autofix-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    # `prod` environment scopes the GHA_PAT secret used to push fixes back.
    environment: prod
    # Fork PRs can't be pushed to from here. Dependabot PRs also cannot access
    # GHA_PAT, and CI already runs the same formatting/lint checks without fixes.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GHA_PAT }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: pnpm install --frozen-lockfile
      - name: Build workspace deps
        run: pnpm --filter @dotabod/shared-utils --filter @dotabod/profanity-filter run build
      # Do not apply Oxlint fixes here: a type-aware fixture fix can turn an
      # intentionally partial Vitest mock into a type error. CI's blocking
      # ratchet reports lint findings; this workflow owns formatting only.
      - name: Auto-format
        run: pnpm run format:fix
      - name: Commit and push fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --no-verify -m "style: auto-format via standalone quality checks"
            git push
          fi
